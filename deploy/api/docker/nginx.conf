server {
    listen 8080;
    server_name _;

    root /var/www/html/public;
    index index.php;

    charset utf-8;
    client_max_body_size 64m;

    # Cabeceras de seguridad.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "same-origin" always;

    # El nombre de un expediente es dato personal. No se guarda en cachés
    # intermedias ni del navegador.
    add_header Cache-Control "no-store, private, must-revalidate" always;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    location ~ \.php$ {
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_read_timeout 120;
    }

    # Los archivos que suben a `storage` NO se sirven. El único camino para
    # llegar a un documento es la API, que autoriza antes de responder.
    location ~ ^/storage/.*\.php$ { deny all; }
    location ~ ^/storage/ { deny all; }
    location ~ /\. { deny all; }
}