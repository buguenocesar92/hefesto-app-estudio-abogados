; ---------------------------------------------------------------------------
; Ajustes de PHP para la API de estudios de abogados.
; ---------------------------------------------------------------------------

memory_limit = 512M
upload_max_filesize = 64M
post_max_size = 64M
max_execution_time = 120

; Los documentos de un expediente son datos personales. No se dejan en la
; salida estándar, que acaba en los registros del contenedor.
display_errors = Off
log_errors = On
error_log = /dev/stderr

expose_php = Off

; La cookie de sesión viaja por HTTPS en producción. `secure` se activa desde
; la variable de entorno en el compose de producción.
session.cookie_httponly = On
session.cookie_samesite = Lax
session.use_strict_mode = On
session.use_only_cookies = On

opcache.enable = 1
opcache.validate_timestamps = 0
opcache.max_accelerated_files = 20000