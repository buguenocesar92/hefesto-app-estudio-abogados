# ---------------------------------------------------------------------------
# Aplicación de Estudios de Abogados de Hefesto Studio: PRODUCCIÓN
# ---------------------------------------------------------------------------
#
# Uso:
#   docker compose -f deploy/docker-compose.prod.yml --env-file .env.prod up -d
#
# QUE CAMBIA RESPECTO A DESARROLLO
# ---------------------------------
#  1. Usa imágenes ya construidas, no `build`. El despliegue tiene que ser
#     reproducible y no depender de que el código fuente esté en el servidor.
#  2. No publica PostgreSQL ni la API. Solo entran por Caddy, con TLS.
#  3. La cookie de sesión exige HTTPS.
#  4. Redis exige contraseña y con política restrictiva.
#  5. Monta el código en solo lectura. Si el servidor se compromete, el atacante
#     no gana acceso al código fuente.
#
# ANTES DEL PRIMER ARRANQUE
# -------------------------
#   docker compose -f deploy/docker-compose.prod.yml --env-file .env.prod \
#       run --rm api php artisan estudio:verificar-aislamiento
#
# Ese comando FALLA si el rol de la base es superusuario o tiene BYPASSRLS, si
# alguna tabla quedó sin política, o si la función de contexto dejó de fallar
# cerrada. No es un aviso: es una condición de despliegue.
# ---------------------------------------------------------------------------

name: estudio-abogados-prod

services:
  caddy:
    image: caddy:2.11.7-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-prod-datos:/data
      - caddy-prod-config:/config
    environment:
      ACME_EMAIL: ${ACME_EMAIL:?falta ACME_EMAIL en el .env.prod}
    depends_on:
      - api
      - web

  api:
    image: ${API_IMAGE:?falta API_IMAGE en el .env.prod}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      APP_NAME: "Estudios de Abogados"
      APP_ENV: production
      APP_DEBUG: "false"
      APP_KEY: ${APP_KEY:?falta APP_KEY en el .env.prod}
      APP_URL: ${APP_URL:?falta APP_URL en el .env.prod}

      SESSION_SECURE_COOKIE: "true"
      SESSION_SAME_SITE: lax
      SESSION_DRIVER: database

      LOG_CHANNEL: stderr
      LOG_LEVEL: warning

      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: ${DB_DATABASE:?falta DB_DATABASE en el .env.prod}
      DB_USERNAME: ${DB_USERNAME:?falta DB_USERNAME en el .env.prod}
      DB_PASSWORD: ${DB_PASSWORD:?falta DB_PASSWORD en el .env.prod}

      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:?falta REDIS_PASSWORD en el .env.prod}
      CACHE_STORE: redis
      QUEUE_CONNECTION: redis

      AUTHENTIK_ISSUER: ${AUTHENTIK_ISSUER:?falta AUTHENTIK_ISSUER en el .env.prod}
      AUTHENTIK_CLIENT_ID: ${AUTHENTIK_CLIENT_ID:?falta AUTHENTIK_CLIENT_ID en el .env.prod}
      AUTHENTIK_CLIENT_SECRET: ${AUTHENTIK_CLIENT_SECRET:?falta AUTHENTIK_CLIENT_SECRET en el .env.prod}
      AUTHENTIK_REDIRECT_URI: ${AUTHENTIK_REDIRECT_URI:?falta AUTHENTIK_REDIRECT_URI en el .env.prod}
      AUTHENTIK_SCOPES: "openid profile email"
      AUTHENTIK_ALGORITMO: RS256

      DOCUMENTOS_PATH: /var/www/html/storage/app/documentos
      ESTUDIO_AVISAR_DOCUMENTO_DUPLICADO: "true"

      # En producción las migraciones NO se aplican solas. Se corren a mano, con
      # el comando verificador antes y después.
      ESTUDIO_CORRER_MIGRACIONES: "false"
    volumes:
      - documentos-prod:/var/www/html/storage/app/documentos

  web:
    image: ${WEB_IMAGE:?falta WEB_IMAGE en el .env.prod}
    restart: unless-stopped
    depends_on:
      - api
    environment:
      NUXT_API_BASE: http://api:8080
      NUXT_PUBLIC_BASE: ${APP_WEB_URL:?falta APP_WEB_URL en el .env.prod}
      NUXT_SESSION_COOKIE: estudio_session

  # Tarea programada: el vigilante de plazos.
  #
  # Corre en un contenedor aparte, y no dentro de la API, porque es una tarea de
  # mantenimiento y no debería competir por recursos con las peticiones de
  # personas. El `schedule:run` de Laravel corre lo que toca y sale.
  vigilante:
    image: ${API_IMAGE:?falta API_IMAGE en el .env.prod}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      APP_KEY: ${APP_KEY}
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: ${DB_DATABASE}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      LOG_CHANNEL: stderr
      DOCUMENTOS_PATH: /var/www/html/storage/app/documentos
    volumes:
      - documentos-prod:/var/www/html/storage/app/documentos:ro
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >
        while true; do
          php artisan schedule:run --no-interaction;
          sleep 300;
        done


  # -------------------------------------------------------------------------
  # PostgreSQL.
  #
  # DOS ROLES, Y NO UNO
  # -------------------
  # `POSTGRES_USER` es el rol de ARRANQUE: la imagen oficial ejecuta
  # `initdb --username="$POSTGRES_USER"` y ese rol nace superusuario. Solo
  # se usa para crear la base y para las tareas administrativas. La
  # aplicacion NUNCA conecta con el.
  #
  # El rol de la aplicacion (`DB_USERNAME`) lo crea
  # `deploy/postgres/inicializar-rol.sh` al inicializar el volumen, con
  # NOSUPERUSER y NOBYPASSRLS explicitos. Le da la propiedad de la base
  # para que las migraciones de Laravel puedan crear el esquema.
  #
  # POR QUE IMPORTA: la documentacion de PostgreSQL 18 dice que los
  # superusuarios "always bypass the row security system", y que
  # `FORCE ROW LEVEL SECURITY` sujeta solo al DUENO de la tabla, no al
  # superusuario. Con un solo rol las politicas no se aplicarian y el
  # aislamiento entre empresas seria decorativo. Ver docs/03.
  # -------------------------------------------------------------------------
  postgres:
    image: postgres:18.6
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:?falta DB_DATABASE en el .env.prod}
      POSTGRES_USER: ${DB_ADMIN_USERNAME:-estudio_abogados_admin}
      POSTGRES_PASSWORD: ${DB_ADMIN_PASSWORD:?falta DB_ADMIN_PASSWORD en el .env.prod}
      # Rol con el que conecta la aplicacion. Lo crea el script de arranque.
      APP_DB_ROLE: ${DB_USERNAME:-estudio_app}
      APP_DB_PASSWORD: ${DB_PASSWORD:?falta DB_PASSWORD en el .env.prod}
    volumes:
      - postgres-prod-datos:/var/lib/postgresql/data
      - ./postgres/inicializar-rol.sh:/docker-entrypoint-initdb.d/inicializar-rol.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-estudio_app} -d ${DB_DATABASE}"]
      interval: 10s
      timeout: 5s
      retries: 10
    # En producción la base NO se publica. La única forma de llegar a ella es
    # desde la red interna de Docker.
    expose:
      - "5432"

  redis:
    image: redis:8.8.3-alpine
    restart: unless-stopped
    command: >-
      redis-server
      --requirepass ${REDIS_PASSWORD}
      --appendonly yes
      --save 900 1
    volumes:
      - redis-prod-datos:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a ${REDIS_PASSWORD} ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
    expose:
      - "6379"

  authentik-postgres:
    image: postgres:18.6
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${AUTHENTIK_POSTGRESQL__NAME:-authentik}
      POSTGRES_USER: ${AUTHENTIK_POSTGRESQL__USER:-authentik}
      POSTGRES_PASSWORD: ${AUTHENTIK_POSTGRESQL__PASSWORD:?falta AUTHENTIK_POSTGRESQL__PASSWORD}
    volumes:
      - authentik-prod-postgres-datos:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${AUTHENTIK_POSTGRESQL__USER:-authentik}"]
      interval: 10s
      timeout: 5s
      retries: 10

  authentik-server:
    image: ghcr.io/goauthentik/server:2025.10
    restart: unless-stopped
    command: server
    depends_on:
      authentik-postgres:
        condition: service_healthy
    environment:
      AUTHENTIK_SECRET_KEY: ${AUTHENTIK_SECRET_KEY:?falta AUTHENTIK_SECRET_KEY en el .env.prod}
      AUTHENTIK_POSTGRESQL__HOST: authentik-postgres
      AUTHENTIK_POSTGRESQL__USER: ${AUTHENTIK_POSTGRESQL__USER:-authentik}
      AUTHENTIK_POSTGRESQL__PASSWORD: ${AUTHENTIK_POSTGRESQL__PASSWORD}
      AUTHENTIK_POSTGRESQL__NAME: ${AUTHENTIK_POSTGRESQL__NAME:-authentik}
      AUTHENTIK_BOOTSTRAP__EMAIL: ${AUTHENTIK_BOOTSTRAP__EMAIL:?falta AUTHENTIK_BOOTSTRAP__EMAIL}
      AUTHENTIK_BOOTSTRAP__PASSWORD: ${AUTHENTIK_BOOTSTRAP__PASSWORD:?falta AUTHENTIK_BOOTSTRAP__PASSWORD}
      AUTHENTIK_BOOTSTRAP__TOKEN: ${AUTHENTIK_BOOTSTRAP__TOKEN:-}
      AUTHENTIK_ERROR_REPORTING__ENABLED: "false"
    volumes:
      - authentik-prod-media:/media

  authentik-worker:
    image: ghcr.io/goauthentik/server:2025.10
    restart: unless-stopped
    command: worker
    depends_on:
      authentik-postgres:
        condition: service_healthy
    environment:
      AUTHENTIK_SECRET_KEY: ${AUTHENTIK_SECRET_KEY}
      AUTHENTIK_POSTGRESQL__HOST: authentik-postgres
      AUTHENTIK_POSTGRESQL__USER: ${AUTHENTIK_POSTGRESQL__USER:-authentik}
      AUTHENTIK_POSTGRESQL__PASSWORD: ${AUTHENTIK_POSTGRESQL__PASSWORD}
      AUTHENTIK_POSTGRESQL__NAME: ${AUTHENTIK_POSTGRESQL__NAME:-authentik}

volumes:
  postgres-prod-datos:
  redis-prod-datos:
  authentik-prod-postgres-datos:
  authentik-prod-media:
  documentos-prod:
  caddy-prod-datos:
  caddy-prod-config: